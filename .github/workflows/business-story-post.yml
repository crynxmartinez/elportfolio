name: Business Story Post (El Martinez FB)

on:
  schedule:
    # 02:00 UTC = 10:00 AM Asia/Manila - Mon, Wed, Fri, Sat, Sun
    - cron: "0 2 * * 0,1,3,5,6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post-story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Generate and post business story
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GHL_PRIVATE_TOKEN: ${{ secrets.GHL_PRIVATE_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/generate-business-story.mjs

      - name: Commit updated log
        run: |
          git config user.name "Business Story Poster"
          git config user.email "actions@users.noreply.github.com"
          git add content/business-story-log.json
          if git diff --staged --quiet; then
            echo "No log changes."
          else
            git commit -m "Log business story post"
            git push
          fi
