name: Auto Blog Writer

on:
  schedule:
    # 00:00 UTC Monday and Friday = 8:00 AM Asia/Manila
    - cron: "0 0 * * 1,5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  write-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Generate post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/generate-post.mjs

      - name: Commit and push if a new post was written
        run: |
          git config user.name "Blog Auto-Writer"
          git config user.email "actions@users.noreply.github.com"
          git add content/blog
          if git diff --staged --quiet; then
            echo "No new post to commit."
          else
            git commit -m "Auto-publish new blog post"
            git push
          fi
