name: LinkedIn Carousel Post (Raphael Martinez)

on:
  schedule:
    # 07:00 UTC = 3:00 PM Asia/Manila - Mon, Wed, Fri, Sat, Sun
    - cron: "0 7 * * 0,1,3,5,6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post-carousel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Generate and post LinkedIn carousel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GHL_PRIVATE_TOKEN: ${{ secrets.GHL_PRIVATE_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/generate-linkedin-carousel.mjs

      - name: Commit updated log
        run: |
          git config user.name "LinkedIn Carousel Poster"
          git config user.email "actions@users.noreply.github.com"
          git add content/linkedin-carousel-log.json
          if git diff --staged --quiet; then
            echo "No log changes."
          else
            git commit -m "Log LinkedIn carousel post"
            git push
          fi
